name: CD

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Automated Release Management
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Release Please
        id: release_please
        uses: googleapis/release-please-action@v4
        with:
          release-type: python